<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Apple Cinema Gold trailer</title>
  <style>
    html,body,#player{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0e12}
    iframe{display:block;border:0;width:100%;height:100%}
  </style>
</head>
<body>
  <div id="player"></div>
  <script>
  (function () {
    'use strict';
    function param(name) {
      var match = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
      return match ? decodeURIComponent(match[1]) : '';
    }
    var id = param('video'), token = param('token'), player = null, destroyed = false, retries = [];
    if (!/^[A-Za-z0-9_-]{11}$/.test(id) || !/^acg_[A-Za-z0-9_]+$/.test(token)) return;
    function send(state, code) {
      // State only, no user data. The parent validates token, source and origin.
      if (!destroyed) parent.postMessage({acgToken:token, state:state, code:code}, '*');
    }
    function clearRetries() { retries.forEach(clearTimeout); retries = []; }
    // Create the iframe ourselves so autoplay delegation/referrer are explicit
    // in both the Lampa -> bridge and bridge -> YouTube embedding layers.
    var frame = document.createElement('iframe'); frame.id = 'player';
    frame.setAttribute('title', 'Трейлер'); frame.setAttribute('tabindex', '-1');
    frame.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture');
    frame.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
    frame.src = 'https://www.youtube.com/embed/' + id + '?enablejsapi=1&autoplay=1&mute=1&controls=0&playsinline=1&rel=0&loop=1&playlist=' + id + '&origin=' + encodeURIComponent(location.origin);
    document.getElementById('player').parentNode.replaceChild(frame, document.getElementById('player'));
    window.onYouTubeIframeAPIReady = function () {
      if (destroyed) return;
      try {
        player = new YT.Player('player', {
          events:{
            onReady:function (event) {
              if (destroyed) return;
              send('ready');
              event.target.mute(); event.target.playVideo();
              if (event.target.getPlayerState && event.target.getPlayerState() === 1) { send('playing'); return; }
              // Some TV WebViews ignore the first play request during setup.
              // Retry only cued/unstarted video, never restart a buffering stream.
              [300, 1200, 3000].forEach(function (delay) {
                retries.push(setTimeout(function () {
                  if (destroyed || !player || !player.getPlayerState) return;
                  var state = player.getPlayerState();
                  if (state === -1 || state === 5) { player.mute(); player.playVideo(); }
                }, delay));
              });
            },
            onStateChange:function (event) {
              if (destroyed) return;
              if (event.data === 1) { clearRetries(); send('playing'); }
              else if (event.data === 0) event.target.playVideo();
            },
            onError:function (event) { clearRetries(); send('error', event.data); },
            onAutoplayBlocked:function () { clearRetries(); send('blocked'); }
          }
        });
      } catch (_) { send('error', 'player'); }
    };
    window.addEventListener('message', function (event) {
      if (event.source !== parent || !event.data || event.data.acgToken !== token || event.data.command !== 'destroy') return;
      destroyed = true;
      clearRetries();
      if (player) { try { player.destroy(); } catch (_) {} player = null; }
    });
    var api = document.createElement('script');
    api.src = 'https://www.youtube.com/iframe_api'; api.async = true;
    api.onerror = function () { send('error', 'api-load'); };
    document.head.appendChild(api);
  })();
  </script>
</body>
</html>
